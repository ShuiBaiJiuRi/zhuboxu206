<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>4色背景动画</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: radial-gradient(circle at top, #1f2a44, #0b1020 55%, #05070d 100%);
      overflow: hidden;
    }

    .box {
      position: relative;
      width: 240px;
      height: 240px;
      border-radius: 28px;
      background: linear-gradient(135deg, #ff4d4f, #52c41a, #1890ff, #faad14);
      background-size: 300% 300%;
      animation: colorFlow 9s ease-in-out infinite, float 5s ease-in-out infinite;
      box-shadow:
        0 30px 50px rgba(0, 0, 0, 0.35),
        0 0 30px rgba(255, 255, 255, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.25);
      overflow: hidden;
      transform: rotate(-8deg);
    }

    .box::before {
      content: "";
      position: absolute;
      inset: -20% -10% auto auto;
      width: 100px;
      height: 100px;
      background: rgba(255, 255, 255, 0.35);
      filter: blur(16px);
      border-radius: 50%;
      animation: glow 5s ease-in-out infinite alternate;
    }

    .box::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        120deg,
        rgba(255, 255, 255, 0.28),
        rgba(255, 255, 255, 0.06) 30%,
        rgba(255, 255, 255, 0.18) 52%,
        transparent 70%
      );
      transform: translateX(-100%);
      animation: sheen 3.5s ease-in-out infinite;
    }

    @keyframes colorFlow {
      0% {
        background-position: 0% 50%;
        filter: hue-rotate(0deg) saturate(1.1);
      }
      25% {
        background-position: 35% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      75% {
        background-position: 65% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes float {
      0%, 100% {
        transform: rotate(-8deg) translateY(0px) scale(1);
      }
      50% {
        transform: rotate(-4deg) translateY(-16px) scale(1.04);
      }
    }

    @keyframes sheen {
      0% {
        transform: translateX(-100%);
      }
      45%, 100% {
        transform: translateX(100%);
      }
    }

    @keyframes glow {
      0% {
        opacity: 0.35;
        transform: scale(0.8);
      }
      100% {
        opacity: 1;
        transform: scale(1.3);
      }
    }
  </style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
