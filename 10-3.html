<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viewport 响应式背景</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-size: 16px;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Microsoft YaHei", sans-serif;
      background: #111827;
      transition: background 0.6s ease;
    }

    .viewport-box {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2em;
      background: #1f2937;
      transition: background 0.6s ease;
    }

    .content {
      text-align: center;
      color: #fff;
      text-shadow: 0 0.25em 1em rgba(0, 0, 0, 0.3);
    }

    .content h1 {
      margin: 0;
      font-size: 3em;
      letter-spacing: 0.2em;
      font-weight: 700;
    }

    .content p {
      margin: 0.8em 0 0;
      font-size: 1.25em;
      letter-spacing: 0.12em;
    }

    @media (max-width: 1200px) {
      body {
        background: #1d3557;
      }

      .viewport-box {
        background: #457b9d;
      }

      .content h1 {
        font-size: 2.5em;
      }

      .content p {
        font-size: 1.1em;
      }
    }

    @media (max-width: 768px) {
      body {
        background: #2a9d8f;
      }

      .viewport-box {
        background: #5ab4ac;
      }

      .content h1 {
        font-size: 2em;
        letter-spacing: 0.1em;
      }

      .content p {
        font-size: 1em;
      }
    }

    @media (max-width: 480px) {
      body {
        background: #f4a261;
      }

      .viewport-box {
        background: #e76f51;
      }

      .content h1 {
        font-size: 1.5em;
        letter-spacing: 0.08em;
      }

      .content p {
        font-size: 0.9em;
      }
    }
  </style>
</head>
<body>
  <div class="viewport-box">
    <div class="content">
      <h1>朱泊旭</h1>
      <p>Viewport 响应式动画</p>
    </div>
  </div>
</body>
</html>
