<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>17-2 · 获取接口数据并展示（fetch + CORS）</title>
<style>
  :root {
    --bg-1:#07111f; --bg-2:#101b2d; --panel:rgba(15,23,42,0.72);
    --line:rgba(255,255,255,0.08); --text:#e5eefc; --muted:#9bb0c9;
    --blue:#60a5fa; --cyan:#67e8f9; --purple:#a78bfa; --pink:#f9a8d4;
    --green:#34d399; --amber:#fbbf24; --red:#fb7185; --shadow:rgba(2,6,23,0.6); --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    background:radial-gradient(circle at top left,rgba(96,165,250,0.2),transparent 28%),
      radial-gradient(circle at bottom right,rgba(167,139,250,0.2),transparent 30%),
      linear-gradient(135deg,var(--bg-1),var(--bg-2));color:var(--text);}
  body{display:flex;justify-content:center;padding:40px 20px 80px;}
  .page{width:min(1180px,100%);background:rgba(10,16,28,0.7);border:1px solid var(--line);
    border-radius:24px;box-shadow:0 24px 90px var(--shadow);backdrop-filter:blur(12px);overflow:hidden;}
  .hero{position:relative;padding:50px 48px 28px;background:
      linear-gradient(120deg,rgba(96,165,250,0.18),rgba(167,139,250,0.12)),rgba(15,23,42,0.5);
    border-bottom:1px solid var(--line);}
  .hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(12px);opacity:.8;}
  .hero::before{width:220px;height:220px;right:8%;top:-50px;background:rgba(103,232,249,0.18);}
  .hero::after{width:180px;height:180px;left:6%;bottom:-30px;background:rgba(249,168,212,0.16);}
  .brand{position:relative;z-index:1;display:flex;align-items:center;gap:18px;margin-bottom:14px;}
  .logo{width:70px;height:70px;border-radius:20px;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:20px;color:#08111d;background:linear-gradient(135deg,var(--cyan),var(--purple));
    box-shadow:0 16px 30px rgba(103,232,249,0.25);font-family:"Cascadia Code",Consolas,monospace;}
  .hero h1{margin:0;font-size:clamp(1.7rem,2.5vw,2.6rem);letter-spacing:1px;}
  .hero .sub{position:relative;z-index:1;margin:0;max-width:880px;color:var(--muted);line-height:1.8;}
  .content{padding:26px 48px 40px;}

  .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px;}
  .toolbar label{color:var(--muted);font-size:0.9rem;}
  select,input[type=text]{
    background:rgba(2,6,23,0.55);border:1px solid var(--line);color:var(--text);
    padding:9px 12px;border-radius:10px;font-size:0.9rem;outline:none;max-width:420px;}
  select:focus,input[type=text]:focus{border-color:rgba(103,232,249,0.45);}
  .btn{cursor:pointer;border:1px solid rgba(255,255,255,0.1);color:var(--text);
    background:linear-gradient(180deg,rgba(148,163,184,0.08),rgba(15,23,42,0.2));
    padding:9px 16px;border-radius:10px;font-size:0.88rem;transition:all .18s;}
  .btn:hover{border-color:rgba(103,232,249,0.4);transform:translateY(-1px);}
  .btn.primary{color:#08111d;background:linear-gradient(135deg,var(--cyan),var(--blue));border-color:transparent;font-weight:700;}

  .state{font-size:0.9rem;margin:8px 0 14px;min-height:20px;}
  .state.loading{color:var(--cyan);}
  .state.error{color:var(--red);}
  .state.ok{color:var(--green);}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(103,232,249,0.3);
    border-top-color:var(--cyan);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
  .grid.images{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.03);transition:transform .2s,box-shadow .2s;}
  .card.click{cursor:pointer;}
  .card:hover{transform:translateY(-3px);box-shadow:0 16px 30px rgba(8,15,28,0.4);border-color:rgba(103,232,249,0.3);}
  .card h3{margin:0 0 6px;font-size:1.02rem;color:var(--cyan);line-height:1.4;}
  .card .meta{color:var(--muted);font-size:0.84rem;line-height:1.6;}
  .card .meta b{color:var(--text);font-weight:600;}
  .card img.thumb{width:100%;height:150px;object-fit:cover;border-radius:10px;margin-bottom:10px;background:#0b1422;}
  .price{color:var(--amber);font-weight:800;font-size:1.1rem;}
  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:0.72rem;font-weight:700;}
  .badge.done{background:rgba(52,211,153,0.15);color:var(--green);border:1px solid rgba(52,211,153,0.3);}
  .badge.todo{background:rgba(251,113,133,0.15);color:var(--red);border:1px solid rgba(251,113,133,0.3);}
  .imgbox{background:rgba(2,6,23,0.5);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .imgbox img{width:100%;display:block;}

  pre.raw{margin:18px 0 0;padding:16px;border-radius:14px;background:rgba(2,6,23,0.6);border:1px solid var(--line);
    font-family:"Cascadia Code",Consolas,monospace;font-size:0.78rem;line-height:1.5;color:#cfe3ff;
    max-height:360px;overflow:auto;white-space:pre;}
  pre.raw .key{color:#82aaff;} pre.raw .str{color:#c3e88d;} pre.raw .num{color:#f78c6c;}
  pre.raw .bool{color:#c792ea;} pre.raw .null{color:#ff5370;}
  .raw-wrap.hidden{display:none;}

  /* 详情弹层 */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,0.75);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .overlay.show{display:flex;}
  .modal{width:min(560px,100%);max-height:86vh;overflow:auto;background:var(--panel-strong,rgba(17,24,39,0.95));
    border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,0.6);}
  .modal img{width:100%;max-height:240px;object-fit:contain;border-radius:12px;background:#0b1422;margin-bottom:14px;}
  .modal h2{margin:0 0 10px;color:var(--cyan);}
  .modal .meta{color:var(--muted);font-size:0.9rem;line-height:1.8;}
  .modal .meta b{color:var(--text);}
  .modal .close{float:right;cursor:pointer;color:var(--muted);border:1px solid var(--line);
    background:transparent;border-radius:8px;padding:4px 10px;font-size:0.85rem;}
  .modal .close:hover{color:var(--text);border-color:rgba(103,232,249,0.4);}

  .footer{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:0.85rem;}
  .tip{color:var(--muted);font-size:0.82rem;margin:4px 0 0;}
  @media (max-width:760px){.hero,.content{padding-left:20px;padding-right:20px;}}
</style>
</head>
<body>
<div class="page">
  <header class="hero">
    <div class="brand">
      <div class="logo">&lt;&gt;</div>
      <div><h1>获取接口数据并展示</h1></div>
    </div>
    <p class="sub">
      用浏览器 <b>fetch()</b> 向<b>允许跨域（CORS）</b>的公开接口请求数据，再把返回的 JSON 渲染成卡片或图片。
      下方接口均经实测支持跨域访问，覆盖图片、列表、以及 <b>列表→详情</b> 的完整流程（DummyJSON 商品）。
    </p>
  </header>

  <main class="content">
    <div class="toolbar">
      <label for="ep">接口：</label>
      <select id="ep"></select>
      <input type="text" id="search" placeholder="搜索关键字（图片类无效）…">
      <button class="btn primary" id="loadBtn">重新获取</button>
      <button class="btn" id="rawBtn">查看原始 JSON</button>
    </div>
    <div class="state" id="state"></div>
    <div class="grid" id="grid"></div>
    <div class="raw-wrap hidden">
      <pre class="raw" id="raw"></pre>
      <p class="tip">↑ 这是接口返回的原始 JSON 文本（已高亮）。</p>
    </div>
    <div class="footer">© 2026 高级网页设计课堂实践 · 17-2 接口数据获取与展示</div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ===== 接口清单（来自「接口.txt」，均已实测支持 CORS） ===== */
const APIS = [
  { id:'dog1',  label:'随机狗狗图片 · dog.ceo',            url:'https://dog.ceo/api/breeds/image/random',        kind:'image' },
  { id:'dog3',  label:'随机猎犬×3 · dog.ceo',              url:'https://dog.ceo/api/breed/hound/images/random/3', kind:'images' },
  { id:'users', label:'用户列表 · jsonplaceholder',        url:'https://jsonplaceholder.typicode.com/users',      kind:'users' },
  { id:'posts', label:'文章列表 · jsonplaceholder',        url:'https://jsonplaceholder.typicode.com/posts',      kind:'posts' },
  { id:'dum',   label:'商品列表 + 详情 · DummyJSON',       url:'https://dummyjson.com/products?limit=8',          kind:'dumProducts' },
  { id:'store', label:'商城商品 · FakeStoreAPI',           url:'https://fakestoreapi.com/products',                kind:'store' },
];

const stateEl = document.getElementById('state');
const gridEl  = document.getElementById('grid');
const rawEl   = document.getElementById('raw');
const rawWrap = document.querySelector('.raw-wrap');
const epEl    = document.getElementById('ep');
const searchEl= document.getElementById('search');
const overlay = document.getElementById('overlay');
const modal   = document.getElementById('modal');

let CURRENT = [];
let RAW_TEXT = '';

/* 高亮 JSON */
function highlightJSON(json){
  json = json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return json.replace(/("(?:\\.|[^"\\])*"(\s*:)?|\b(?:true|false)\b|\bnull\b|-?\d+(?:\.\d+)?(?:[eE][+\-]?\d+)?)/g, m => {
    let cls='num';
    if(/^"/.test(m)) cls = /:$/.test(m) ? 'key' : 'str';
    else if(/^(true|false)$/.test(m)) cls='bool';
    else if(/^null$/.test(m)) cls='null';
    return `<span class="${cls}">${m}</span>`;
  });
}

/* ===== 离线兜底数据 ===== */
const FALLBACK = {
  dog1: { message:'https://images.dog.ceo/breeds/sample-1.jpg', status:'success' },
  dog3: { message:['https://images.dog.ceo/breeds/hound-1.jpg','https://images.dog.ceo/breeds/hound-2.jpg','https://images.dog.ceo/breeds/hound-3.jpg'], status:'success' },
  users: [{name:"张三",username:"zhangsan",email:"zs@demo.com",phone:"010-1234",address:{city:"北京"},company:{name:"演示公司"}}],
  posts: [{userId:1,title:"hello world",body:"示例文章，用于演示接口不可达时的兜底展示。"}],
  dum:   { products:[{id:1,title:"演示商品",price:199,brand:"Demo",category:"电子",thumbnail:"https://via.placeholder.com/200",description:"接口不可达时的样例。",rating:4.5,stock:20}] },
  store: [{id:1,title:"演示商品",price:99,category:"数码",image:"https://via.placeholder.com/200",description:"接口不可达时的样例。"}]
};

/* ===== 渲染各类数据 ===== */
function render(api, data){
  const kind = api.kind;
  if(kind === 'image'){
    gridEl.className = 'grid images';
    gridEl.innerHTML = `<div class="imgbox"><img src="${data.message}" alt="dog"></div>`;
  }
  else if(kind === 'images'){
    gridEl.className = 'grid images';
    gridEl.innerHTML = data.message.map(u => `<div class="imgbox"><img src="${u}" alt="dog"></div>`).join('');
  }
  else if(kind === 'users'){
    gridEl.className = 'grid';
    CURRENT = data;
    gridEl.innerHTML = data.map(u => `<div class="card"><h3>${u.name}</h3>
      <div class="meta"><b>用户名：</b>@${u.username}<br><b>邮箱：</b>${u.email}<br>
      <b>电话：</b>${u.phone}<br><b>城市：</b>${u.address.city} · ${u.company.name}</div></div>`).join('');
  }
  else if(kind === 'posts'){
    gridEl.className = 'grid';
    CURRENT = data.slice(0,12);
    gridEl.innerHTML = CURRENT.map(p => `<div class="card"><h3>${cap(p.title)}</h3>
      <div class="meta"><b>作者 ID：</b>${p.userId}<br>${p.body.slice(0,90)}…</div></div>`).join('');
  }
  else if(kind === 'dumProducts'){
    gridEl.className = 'grid';
    CURRENT = data.products || data;          // 兼容 列表 / 详情 两种结构
    gridEl.innerHTML = CURRENT.map(p => `<div class="card click" data-id="${p.id}"><img class="thumb" src="${p.thumbnail}" alt="">
      <h3>${p.title}</h3>
      <div class="meta"><span class="price">$${p.price}</span> · <b>${p.brand||''}</b><br>
      <b>分类：</b>${p.category}</div></div>`).join('');
    gridEl.querySelectorAll('.card.click').forEach(c =>
      c.onclick = () => showDetail(c.dataset.id));
  }
  else if(kind === 'store'){
    gridEl.className = 'grid';
    CURRENT = data.slice(0,12);
    gridEl.innerHTML = CURRENT.map(p => `<div class="card"><img class="thumb" src="${p.image}" alt="">
      <h3>${p.title}</h3>
      <div class="meta"><span class="price">$${p.price}</span><br><b>分类：</b>${p.category}</div></div>`).join('');
  }
}
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;

/* ===== 商品详情（列表 → 详情） ===== */
async function showDetail(id){
  modal.innerHTML = '<button class="close">关闭</button><p class="state loading"><span class="spinner"></span>加载详情中…</p>';
  overlay.classList.add('show');
  modal.querySelector('.close').onclick = () => overlay.classList.remove('show');
  try{
    const res = await fetch('https://dummyjson.com/products/'+id);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const p = await res.json();
    modal.innerHTML = `<button class="close">关闭</button>
      <img src="${p.thumbnail}" alt="">
      <h2>${p.title}</h2>
      <div class="meta">
        <span class="price">$${p.price}</span> &nbsp; <b>评分：</b>${p.rating} ★ &nbsp; <b>库存：</b>${p.stock}<br>
        <b>品牌：</b>${p.brand} &nbsp; <b>分类：</b>${p.category}<br><br>
        <b>描述：</b>${p.description}
      </div>`;
    modal.querySelector('.close').onclick = () => overlay.classList.remove('show');
  }catch(e){
    modal.innerHTML = '<button class="close">关闭</button><p class="state error">详情加载失败：'+e.message+'</p>';
    modal.querySelector('.close').onclick = () => overlay.classList.remove('show');
  }
}
overlay.onclick = e => { if(e.target === overlay) overlay.classList.remove('show'); };

/* ===== 加载主流程 ===== */
async function load(){
  const api = APIS[epEl.selectedIndex];
  gridEl.className = 'grid';
  gridEl.innerHTML = '';
  rawWrap.classList.add('hidden');
  stateEl.className = 'state loading';
  stateEl.innerHTML = '<span class="spinner"></span>正在请求 ' + api.url + ' …';
  try{
    const res = await fetch(api.url);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    render(api, data);
    RAW_TEXT = JSON.stringify((api.kind==='dumProducts'&&data.products)?data.products:data, null, 2);
    rawEl.innerHTML = highlightJSON(RAW_TEXT);
    stateEl.className = 'state ok';
    stateEl.textContent = '✓ 成功获取并渲染（来自真实接口）';
  }catch(err){
    const fb = FALLBACK[api.id];
    render(api, fb);
    RAW_TEXT = JSON.stringify(fb, null, 2);
    rawEl.innerHTML = highlightJSON(RAW_TEXT);
    stateEl.className = 'state error';
    stateEl.textContent = '⚠ 接口请求失败（'+err.message+'），已展示内置样例数据。';
  }
}

function applySearch(){
  const kw = searchEl.value.trim().toLowerCase();
  const kind = APIS[epEl.selectedIndex].kind;
  if(kind==='image'||kind==='images') return;
  if(!kw || !CURRENT.length){          // 清空时直接显示全部，避免重复请求
    gridEl.querySelectorAll('.card').forEach(c => c.style.display = '');
    return;
  }
  const list = CURRENT.filter(it => JSON.stringify(it).toLowerCase().includes(kw));
  gridEl.querySelectorAll('.card').forEach((c,i) => {
    c.style.display = list.includes(CURRENT[i]) ? '' : 'none';
  });
}

/* ===== 初始化 ===== */
APIS.forEach((a,i) => { const o=document.createElement('option'); o.value=i; o.textContent=a.label; epEl.appendChild(o); });
document.getElementById('loadBtn').onclick = load;
epEl.onchange = load;
searchEl.oninput = applySearch;
document.getElementById('rawBtn').onclick = () => {
  rawWrap.classList.toggle('hidden');
  document.getElementById('rawBtn').textContent = rawWrap.classList.contains('hidden') ? '查看原始 JSON' : '隐藏原始 JSON';
};
load();
</script>
</body>
</html>
