<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS动画幻灯片</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #f6f7fb, #e8eefc);
      font-family: "Microsoft YaHei", sans-serif;
    }

    .card {
      width: 620px;
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.12);
    }

    .slider {
      position: relative;
      width: 100%;
      height: 420px;
      overflow: hidden;
      background: #ddd;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      animation: fade 9s infinite ease-in-out;
    }

    .slide .caption {
      position: absolute;
      left: 24px;
      bottom: 24px;
      padding: 10px 18px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      border-radius: 8px;
      font-size: 18px;
      letter-spacing: 2px;
      white-space: nowrap;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    .slide:nth-child(2) {
      animation-delay: 3s;
    }

    .slide:nth-child(3) {
      animation-delay: 6s;
    }

    .slide img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .text {
      padding: 24px 28px 30px;
      background: #fff;
    }

    .title {
      margin: 0 0 8px;
      font-size: 28px;
      color: #222;
      letter-spacing: 2px;
    }

    .desc {
      margin: 0;
      font-size: 16px;
      line-height: 1.8;
      color: #666;
    }

    .author {
      margin-top: 18px;
      text-align: right;
      font-size: 18px;
      font-weight: 700;
      color: #2f7cf6;
      letter-spacing: 2px;
    }

    @keyframes fade {
      0%, 20% {
        opacity: 0;
        transform: scale(1.02);
      }
      25%, 70% {
        opacity: 1;
        transform: scale(1);
      }
      80%, 100% {
        opacity: 0;
        transform: scale(0.98);
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="slider">
      <div class="slide">
        <img src="./photo/a1.jpg" alt="图片1" />
        <div class="caption">风景1</div>
      </div>
      <div class="slide">
        <img src="./photo/a2.jpg" alt="图片2" />
        <div class="caption">风景2</div>
      </div>
      <div class="slide">
        <img src="./photo/a3.jpg" alt="图片3" />
        <div class="caption">风景3</div>
      </div>
    </div>

    <div class="text">
      <h1 class="title">CSS动画幻灯片</h1>
      <p class="desc">利用纯 CSS animation 实现图片自动切换效果，图文并茂，适合展示作品、介绍内容或个人主页。</p>
      <div class="author">朱泊旭</div>
    </div>
  </div>
</body>
</html>
