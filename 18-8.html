<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>18-8 · 数据大屏 · 全国销售运营监控中心</title>
<script src="./cdn/echarts/echarts.min.js"></script>
<style>
  :root {
    --bg-0: #02060f; --bg-1: #050d1c; --bg-2: #0a1628;
    --cyan: #00e5ff; --blue: #2d7bff; --purple: #a855f7;
    --green: #22d3ee; --amber: #fbbf24; --pink: #f472b6;
    --text: #e6f3ff; --muted: #7a93b3; --dim: #3d5470;
    --line: rgba(0, 229, 255, 0.18);
    --glow: 0 0 16px rgba(0, 229, 255, 0.25);
    --mono: "Cascadia Code", "Consolas", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(45, 123, 255, 0.22), transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(168, 85, 247, 0.15), transparent 60%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1) 55%, var(--bg-2));
    color: var(--text);
  }

  /* ---------- 顶部标题 ---------- */
  .header {
    position: relative; height: 72px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, rgba(0, 229, 255, 0.1), transparent);
    border-bottom: 1px solid var(--line);
  }
  .header::before, .header::after {
    content: ""; position: absolute; top: 50%;
    width: 22%; height: 2px; transform: translateY(-50%);
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  }
  .header::before { left: 8%; }
  .header::after  { right: 8%; transform: translateY(-50%) scaleX(-1); }
  .header h1 {
    font-size: 26px; letter-spacing: 6px; font-weight: 800;
    background: linear-gradient(180deg, #ffffff 10%, var(--cyan) 60%, var(--blue));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 24px rgba(0, 229, 255, 0.3);
  }
  .header .side {
    position: absolute; top: 0; bottom: 0; width: 260px;
    display: flex; align-items: center; font-size: 13px; color: var(--muted);
  }
  .header .side.left  { left: 24px;  justify-content: flex-start; gap: 16px; }
  .header .side.right { right: 24px; justify-content: flex-end;   gap: 16px; }
  .header .side .val { font-family: var(--mono); color: var(--cyan); font-size: 14px; }

  /* ---------- 大屏容器 ---------- */
  .screen {
    display: grid;
    grid-template-columns: 340px 1fr 360px;
    gap: 14px; padding: 14px;
    height: calc(100vh - 72px);
  }

  .col { display: flex; flex-direction: column; gap: 14px; min-height: 0; }

  /* ---------- 卡片 ---------- */
  .panel {
    position: relative; flex: 1; min-height: 0;
    background: linear-gradient(180deg, rgba(8, 20, 40, 0.85), rgba(5, 12, 26, 0.92));
    border: 1px solid var(--line);
    display: flex; flex-direction: column;
    clip-path: polygon(
      0 10px, 10px 0, calc(100% - 10px) 0, 100% 10px,
      100% calc(100% - 10px), calc(100% - 10px) 100%,
      10px 100%, 0 calc(100% - 10px)
    );
  }
  .panel::before, .panel::after {
    content: ""; position: absolute; width: 14px; height: 14px;
    border-color: var(--cyan); border-style: solid; border-width: 0; pointer-events: none;
  }
  .panel::before { top: 3px; left: 3px; border-top-width: 2px; border-left-width: 2px; }
  .panel::after  { bottom: 3px; right: 3px; border-bottom-width: 2px; border-right-width: 2px; }

  .panel-head {
    position: relative; padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(90deg, rgba(0, 229, 255, 0.08), transparent 70%);
  }
  .panel-head .tag {
    width: 4px; height: 16px; background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan); border-radius: 2px;
  }
  .panel-head .title {
    font-size: 14px; font-weight: 700; letter-spacing: 2px; color: var(--text);
  }
  .panel-head .sub {
    font-size: 11px; color: var(--muted); margin-left: 4px;
    font-family: var(--mono);
  }
  .panel-head .more {
    margin-left: auto; font-size: 11px; color: var(--dim); font-family: var(--mono);
  }
  .panel-body { flex: 1; min-height: 0; padding: 10px 12px; position: relative; }

  /* ---------- KPI 行 ---------- */
  .kpi-row {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  .kpi {
    background: linear-gradient(135deg, rgba(0, 229, 255, 0.08), rgba(45, 123, 255, 0.06));
    border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; text-align: center;
    position: relative; overflow: hidden;
  }
  .kpi .n {
    font-family: var(--mono); font-size: 22px; font-weight: 800;
    background: linear-gradient(180deg, #fff, var(--cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    line-height: 1.2;
  }
  .kpi .l { font-size: 11px; color: var(--muted); margin-top: 4px; letter-spacing: 1px; }
  .kpi .tr { font-size: 10px; font-family: var(--mono); margin-top: 3px; }
  .kpi .tr.up   { color: var(--green); }
  .kpi .tr.down { color: var(--pink); }

  /* ---------- 表格 ---------- */
  .rank { width: 100%; border-collapse: collapse; font-size: 12px; }
  .rank th, .rank td {
    padding: 7px 6px; text-align: left; border-bottom: 1px dashed rgba(0, 229, 255, 0.1);
  }
  .rank th { color: var(--cyan); font-weight: 600; font-size: 11px; letter-spacing: 1px; }
  .rank td { color: var(--text); }
  .rank td.num { font-family: var(--mono); text-align: right; color: var(--amber); }
  .rank td.bar { width: 45%; padding: 7px 0; }
  .rank .bar-track {
    height: 6px; background: rgba(0, 229, 255, 0.08); border-radius: 3px; overflow: hidden;
  }
  .rank .bar-fill {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--cyan), var(--blue));
    box-shadow: 0 0 8px rgba(0, 229, 255, 0.5);
  }
  .rank td.rk { width: 22px; font-family: var(--mono); font-weight: 800; color: var(--muted); }
  .rank tr.top1 td.rk { color: var(--amber); }
  .rank tr.top2 td.rk { color: #cbd5e1; }
  .rank tr.top3 td.rk { color: #d4a574; }

  /* ---------- 跑马灯 ---------- */
  .marquee {
    height: 100%; overflow: hidden; position: relative;
  }
  .marquee-track {
    display: flex; flex-direction: column; gap: 8px;
    animation: scroll-up 28s linear infinite;
  }
  @keyframes scroll-up {
    0%   { transform: translateY(0); }
    100% { transform: translateY(-50%); }
  }
  .news {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 7px 10px; background: rgba(0, 229, 255, 0.04);
    border-left: 2px solid var(--cyan); border-radius: 0 6px 6px 0;
    font-size: 12px; line-height: 1.6;
  }
  .news .t { font-family: var(--mono); font-size: 11px; color: var(--cyan); white-space: nowrap; margin-top: 1px; }
  .news .c { color: var(--text); flex: 1; }
  .news .c b { color: var(--amber); font-weight: 600; }
  .news .s {
    font-size: 10px; padding: 1px 6px; border-radius: 3px;
    background: rgba(0, 229, 255, 0.12); color: var(--cyan); font-family: var(--mono); flex-shrink: 0;
  }
  .news .s.warn { background: rgba(251, 191, 36, 0.12); color: var(--amber); }
  .news .s.bad  { background: rgba(244, 114, 182, 0.14); color: var(--pink); }

  /* ---------- 图表容器 ---------- */
  .chart { width: 100%; height: 100%; }

  /* ---------- 中间列地图区域 ---------- */
  .map-wrap { position: relative; width: 100%; height: 100%; }

  /* ---------- 响应式（仅大屏场景，小屏隐藏次要） ---------- */
  @media (max-width: 1400px) {
    .screen { grid-template-columns: 280px 1fr 300px; }
    .header h1 { font-size: 22px; letter-spacing: 4px; }
  }
</style>
</head>
<body>

<script>
/* =========================================================
   18-8 数据大屏 · 全国销售运营监控中心
   ECharts (本地 UMD) + 本地 china.json GeoJSON
   ========================================================= */

/* ---------- 实时时钟 ---------- */
function pad(n){ return n < 10 ? '0'+n : ''+n; }
function tick(){

    `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} 周${week}`;
  document.getElementById('timeStr').textContent =
    `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
tick(); setInterval(tick, 1000);

/* ---------- 地图 GeoJSON ---------- */

  {name:'贵州', value:2100,  coords:[106.7135, 26.5783]},
  {name:'黑龙江',value:2000, coords:[126.6424, 45.7567]},

  {name:'西藏', value:300,   coords:[91.1172,  29.6456]},
  {name:'天津', value:3500,  coords:[117.2009, 39.0842]},
  {name:'台湾', value:2800,  coords:[121.5654, 25.033]},
  {name:'香港', value:2300,  coords:[114.1694, 22.3193]},
  {name:'澳门', value:800,   coords:[113.5491, 22.199]}
];

/* ---------- 注册地图 ---------- */
fetch('./cdn/echarts/json/china.json')
  .then(r => r.json())
  .then(geo => {
    echarts.registerMap('china', geo);
    initCharts();
  })
  .catch(err => {
    console.error('地图数据加载失败', err);
    document.getElementById('chartMap').innerHTML =
      '<div style="padding:40px;color:#f472b6;font-size:14px;text-align:center">地图 GeoJSON 加载失败<br>请确认 ./cdn/echarts/json/china.json 存在</div>';
  });

/* ---------- 公共：ECharts 主题色 ---------- */
const TX = '#e6f3ff';
const MT = '#7a93b3';
const gridCommon = { left: 48, right: 24, top: 36, bottom: 36, containLabel: false };

/* ---------- 排行表 ---------- */
function renderRank() {
  const sorted = [...PROVINCE_DATA].sort((a,b)=>b.value-a.value).slice(0,10);
  const max = sorted[0].value;
  const tbody = document.querySelector('#rankTable tbody');
  tbody.innerHTML = sorted.map((p, i) => {
    const cls = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
    const pct = ((p.value / max) * 100).toFixed(1);
    return `<tr class="${cls}">
      <td class="rk">${String(i+1).padStart(2,'0')}</td>
      <td>${p.name}</td>
      <td class="bar"><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div></td>
      <td class="num">${(p.value/100).toFixed(1)}亿</td>
    </tr>`;
  }).join('');
}

    { t: '14:18:05', c: '<b>浙江</b> · 双十一预售破 120 万单', s: 'info' },
    { t: '14:16:44', c: '物流节点 <b>北京-顺义</b> 延迟 18 分钟', s: 'warn' },
    { t: '14:15:12', c: '<b>四川</b> · 成都分中心 GMV 同比 +34%', s: 'info' },
    { t: '14:13:58', c: '支付网关 <b>alipay</b> 成功率 99.92%', s: 'info' },
    { t: '14:12:03', c: '<b>上海</b> · 新客注册破 <b>28,400</b>', s: 'info' },
    { t: '14:10:47', c: '库存预警：<b>iPhone 16 Pro</b> 仅剩 4%', s: 'bad' },
    { t: '14:09:21', c: '<b>山东</b> · 青岛仓峰值处理 3.8 万单/小时', s: 'info' },
    { t: '14:07:09', c: '新渠道 <b>抖音直播</b> 贡献 GMV 1.2 亿', s: 'info' },
    { t: '14:05:33', c: '<b>新疆</b> · 偏远地区履约时效提升 12%', s: 'info' }
  ];
  const html = items.map(it =>
    `<div class="news"><span class="t">${it.t}</span><span class="c">${it.c}</span><span class="s ${it.s === 'info' ? '' : it.s}">${it.s === 'warn' ? 'WARN' : it.s === 'bad' ? 'ALERT' : 'EVT'}</span></div>`
  ).join('');
  document.getElementById('marquee').innerHTML = html;
}

/* =========================================================
   图表初始化
   ========================================================= */
let mapChart, pieChart, lineChart, radarChart, barChart;

function initCharts() {
  renderRank();
  renderMarquee();

  mapChart   = echarts.init(document.getElementById('chartMap'));
  pieChart   = echarts.init(document.getElementById('chartPie'));
  lineChart  = echarts.init(document.getElementById('chartLine'));
  radarChart = echarts.init(document.getElementById('chartRadar'));
  barChart   = echarts.init(document.getElementById('chartBar'));

  drawMap();
  drawPie();
  drawLine();
  drawRadar();
  drawBar();

  window.addEventListener('resize', () => {
    [mapChart, pieChart, lineChart, radarChart, barChart].forEach(c => c && c.resize());
  });

  startTick();
}

/* ---------- 图 1：中国地图 + 散点涟漪 + 热力 ---------- */
function drawMap() {
  const max = Math.max(...PROVINCE_DATA.map(p => p.value));
  mapChart.setOption({
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'item',
      backgroundColor: 'rgba(5,12,26,0.95)',
      borderColor: '#00e5ff', borderWidth: 1,
      textStyle: { color: TX, fontSize: 13 },
      formatter: p => {
        if (p.seriesType === 'effectScatter' || p.seriesType === 'scatter') {

/* ---------- 模拟涟漪扩散（每隔 3 秒加一个新散点） ---------- */
function startTick() {
  let idx = 0;
  setInterval(() => {
    if (!mapChart) return;
    const pool = PROVINCE_DATA.filter(p => p.value > 2500);
    const p = pool[Math.floor(Math.random() * pool.length)];
    const scatter = mapChart.getOption().series[1];
    const curData = scatter.data.filter(d => d._alive !== false || !d._born);
    curData.push({
      name: p.name, value: [...p.coords, p.value], _born: Date.now(), _alive: true
    });
    curData.forEach(d => {
      if (d._born && Date.now() - d._born > 8000) d._alive = false;
    });
    mapChart.setOption({ series: [{ data: PROVINCE_DATA.map(pv => ({ name: pv.name, value: pv.value })) }, { data: curData.filter(d => d._alive !== false) }] });
    idx++;
  }, 3500);
}
